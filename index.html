<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WOD Timer</title>
  <meta name="description" content="A workout timer with LED-style digits.">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WOD Timer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <section id="menu" class="screen menu" aria-labelledby="menu-title">
    <h1 id="menu-title" class="screen-title">WOD Timer</h1>
    <div class="mode-grid">
      <button type="button" data-mode="fightGoneBad">Fight Gone Bad</button>
      <button type="button" data-mode="forTime">For Time</button>
      <button type="button" data-mode="amrap">AMRAP</button>
      <button type="button" data-mode="emom">EMOM</button>
      <button type="button" data-mode="tabata">Tabata</button>
      <button type="button" data-mode="custom">Custom</button>
    </div>
  </section>

  <section id="setup" class="screen setup" aria-labelledby="setup-title" hidden>
    <header class="setup-header">
      <button id="setup-back" type="button">Back</button>
      <h1 id="setup-title" class="screen-title"></h1>
    </header>
    <div id="setup-fields" class="setup-fields"></div>
    <footer class="setup-footer">
      <button id="setup-defaults" type="button">Defaults</button>
      <button id="setup-start" type="button" class="primary">Start</button>
    </footer>
  </section>

  <main id="timer" class="screen timer" data-tone="red" hidden>
    <section class="display">
      <div id="clock" class="clock led" role="timer"></div>
      <div id="side" class="side">
        <div id="round" class="round led blank"></div>
        <div id="rest" class="rest blank">REST</div>
      </div>
    </section>
    <section class="controls">
      <div id="mode-row" class="control-row" hidden>
        <button id="minus" type="button" aria-label="Subtract 1 round">&minus;1</button>
        <button id="plus" type="button" class="primary" aria-label="Add 1 round">+1</button>
        <button id="done" type="button" class="primary">Done</button>
      </div>
      <div class="control-row">
        <button id="menu-button" type="button">Menu</button>
        <button id="reset" type="button" hidden>Reset</button>
        <button id="start" type="button" class="wide">Start</button>
        <button id="pause" type="button" class="wide" hidden>Pause</button>
      </div>
    </section>
  </main>
</body>
</html>
