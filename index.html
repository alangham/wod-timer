<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WOD Timer</title>
  <meta name="description" content="A workout timer with LED-style digits.">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WOD Timer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <section id="menu" class="screen menu" aria-labelledby="menu-title">
    <h1 id="menu-title" class="screen-title">WOD Timer</h1>
    <div class="mode-grid">
      <button type="button" data-mode="fightGoneBad">Fight Gone Bad</button>
      <button type="button" data-mode="forTime">For Time</button>
      <button type="button" data-mode="amrap">AMRAP</button>
      <button type="button" data-mode="emom">EMOM</button>
      <button type="button" data-mode="tabata">Tabata</button>
      <button type="button" data-mode="custom">Custom</button>
    </div>
  </section>

  <section id="setup" class="screen setup" aria-labelledby="setup-title" hidden>
    <header class="setup-header">
      <button id="setup-back" type="button">Back</button>
      <h1 id="setup-title" class="screen-title"></h1>
    </header>
    <div id="setup-fields" class="setup-fields"></div>
    <footer class="setup-footer">
      <button id="setup-defaults" type="button">Defaults</button>
      <button id="setup-start" type="button" class="primary">Start</button>
    </footer>
  </section>

  <main id="timer" class="screen timer" data-tone="red" hidden>
    <section id="display" class="display">
      <div id="clock" class="clock led" role="timer"></div>
      <div id="side" class="side">
        <div id="round" class="round led blank"></div>
        <div id="rest" class="rest blank">REST</div>
      </div>
    </section>
    <!-- The order is the order on the screen: top to bottom in the landscape
         rail, left to right in the portrait row. Small buttons Menu, Reset and
         -1 come first. The large button comes next. Pause comes last. -->
    <section id="controls" class="controls">
      <button id="menu-button" type="button" class="icon" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
      </button>
      <button id="reset-icon" type="button" class="icon" aria-label="Reset" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.94 9A7 7 0 1 0 12 5.5M14.8 2.7L12 5.5l2.8 2.8"/></svg>
      </button>
      <button id="minus" type="button" class="icon" aria-label="&minus;1" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12.5h7M14 8l3.5-2.5V19"/></svg>
      </button>
      <button id="start" type="button" class="big primary">Start</button>
      <button id="plus" type="button" class="big primary" hidden>+1</button>
      <button id="done" type="button" class="big primary" hidden>Done</button>
      <button id="resume" type="button" class="big secondary" hidden>Resume</button>
      <button id="reset" type="button" class="big secondary" hidden>Reset</button>
      <button id="pause" type="button" class="icon" aria-label="Pause" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
    </section>
  </main>
</body>
</html>
